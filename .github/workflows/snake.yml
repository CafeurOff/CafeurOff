# Regenerates the contribution snake every day and publishes it to the `output` branch.
name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#663BE0&color_dots=#ebedf0,#d9cff9,#b3a0f3,#8c70ec,#663BE0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#967AFA&color_dots=#161b22,#2e2452,#4a3a8a,#7058c8,#967AFA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
